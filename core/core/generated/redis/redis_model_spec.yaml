openapi: 3.0.0
info:
  title: "Redis Data Models"
  version: 1.0.0

# No servers or paths because these data classes aren't exposed via REST
servers: []
paths: {}

components:
  schemas:
    # -----------------
    # ENUMS
    # -----------------
    Environment:
      type: string
      description: "Example environment enumeration"
      enum:
        - DEV
        - STAGE
        - PROD

    # -----------------
    # BuyLimit
    # -----------------
    BuyLimit:
      type: object
      description: "Buy limit entry for an item"
      properties:
        item_id:
          type: integer
        bought:
          type: integer
        limit:
          type: integer
        reset_time:
          type: number
          nullable: true
      required:
        - item_id
        - bought
        - limit

    # -----------------
    # PnlCalcData / PnlSnapshot / Pnl
    # -----------------
    PnlCalcData:
      type: object
      description: "Data used to calculate PnL"
      properties:
        trade_ids:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        inv_snapshot:
          $ref: "../gds/gds_api_spec.yaml#/components/schemas/Inventory"
        exchange_snapshot:
          $ref: "../gds/gds_api_spec.yaml#/components/schemas/Exchange"
        prices_snapshot:
          type: object
          additionalProperties:
            $ref: "../price/price_model_spec.yaml#/components/schemas/LatestPrice"
      required:
        - trade_ids
        - inv_snapshot
        - exchange_snapshot
        - prices_snapshot

    PnlSnapshot:
      type: object
      description: "Single snapshot of PnL at a given time"
      properties:
        strat_pnl:
          type: object
          description: "Map of strat name -> PnL amount"
          additionalProperties:
            type: integer
        calc_data:
          $ref: "#/components/schemas/PnlCalcData"
        update_time:
          type: number
      required:
        - strat_pnl
        - calc_data
        - update_time

    Pnl:
      type: object
      description: "Object storing a session's PnL"
      properties:
        session_id:
          type: string
        total_pnl:
          type: integer
        pnl_snapshots:
          type: array
          items:
            $ref: "#/components/schemas/PnlSnapshot"
        update_time:
          type: number
      required:
        - session_id
        - total_pnl
        - pnl_snapshots
        - update_time

    # -----------------
    # TradeSession
    # -----------------
    TradeSession:
      type: object
      description: "Object representing a trade session"
      properties:
        session_id:
          type: string
        player_name:
          type: string
        env:
          $ref: "#/components/schemas/Environment"
        start_metadata:
          $ref: "#/components/schemas/StartMetadata"
        active_orders:
          type: object
          description: "Map from integer (some ID) -> Order"
          additionalProperties:
            $ref: "#/components/schemas/Order"
        orders:
          type: object
          description: "Map from strat name -> list of orders"
          additionalProperties:
            type: array
            items:
              $ref: "#/components/schemas/Order"
        trades:
          type: object
          description: "Map from strat name -> list of trades"
          additionalProperties:
            type: array
            items:
              $ref: "#/components/schemas/Trade"
      required:
        - session_id
        - player_name
        - env
        - start_metadata
        - active_orders
        - orders
        - trades

    Trade:
      type: object
      description: "An order that has been booked"
      properties:
        id:
          type: string
        calc_cycle:
          type: integer
        strat_name:
          type: string
        transacted:
          type: integer
        metadata:
          $ref: "#/components/schemas/OfferMetadata"
        time:
          type: number
      required:
        - id
        - calc_cycle
        - strat_name
        - transacted
        - metadata
        - time

    Order:
      type: object
      description: "Generated by strategies and submitted to the GE"
      properties:
        id:
          type: string
        calc_cycle:
          type: integer
        strat_name:
          type: string
        metadata:
          $ref: "#/components/schemas/OfferMetadata"
        time:
          type: number
      required:
        - id
        - calc_cycle
        - strat_name
        - metadata
        - time

    OfferMetadata:
      type: object
      description: "Metadata within an offer"
      properties:
        type:
          $ref: "#/components/schemas/OfferType"
        item_id:
          type: integer
        price:
          type: integer
        quantity:
          type: integer
        ge_slot:
          type: integer
      required:
        - type
        - item_id
        - price
        - quantity
        - ge_slot

    OfferType:
      type: string
      description: "Types of offers"
      enum:
        - NOT_SPECIFIED
        - CANCEL_BUY
        - CANCEL_SELL
        - BUY
        - SELL

    StartMetadata:
      type: object
      description: "State of the world at trade session start"
      properties:
        start_time:
          type: number
        start_nw:
          type: integer
        start_items:
          type: object
          additionalProperties:
            type: integer
      required:
        - start_time
        - start_nw
        - start_items
